name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022

    env:
      # RelWithDebInfo mirrors the project's "windows-release" preset.
      BUILD_TYPE: RelWithDebInfo
      VCPKG_TRIPLET: x64-windows
      QT_VERSION: 6.7.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Toolchain ----------------------------------------------------------
      # CMake (>=3.24 required by the project) + Ninja, pinned recent versions.
      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      # MSVC compiler environment (cl, link) on PATH for the Ninja generator.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Prebuilt Qt6 instead of building it from source via vcpkg. Provides
      # Core/Gui/Widgets/PrintSupport/Concurrent/Test (all in qtbase). The
      # action puts Qt's bin on PATH and exports QT_ROOT_DIR for CMake.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      # --- vcpkg (classic mode) ----------------------------------------------
      # Use the vcpkg already installed on the runner (VCPKG_INSTALLATION_ROOT)
      # in CLASSIC mode. We deliberately install only the libraries that CMake
      # resolves through find_package(); the rest (HighFive, exprtk, QCustomPlot,
      # ConcurrentQueue, Beckhoff ADS, mdflib) are pulled in by FetchContent at
      # configure time.
      #
      # NOTE: we do NOT use manifest mode. vcpkg.json lists qtbase / qcustomplot
      # / qxlsx, all of which would force a multi-hour Qt build from source; Qt
      # is provided prebuilt above instead.
# Persist vcpkg's source-tarball downloads across runs. They are content-
      # addressed (SHA512-verified), so reuse is safe, and accumulating them
      # means transient 504s on GitHub's archive endpoint converge to success
      # instead of re-downloading everything each run. Saved on every outcome
      # (if: always) so partial progress is never lost.
      - name: Restore vcpkg downloads cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-downloads-

      # Retry to ride out transient 504s from GitHub's archive endpoint on the
      # source tarballs. vcpkg is incremental, so each retry resumes from the
      # package that failed to download.
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          $attempts = 12
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "::group::vcpkg install (attempt $i/$attempts)"
            & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install --classic --triplet $env:VCPKG_TRIPLET `
              "hdf5[cpp,zlib]" `
              spdlog `
              nlohmann-json `
              gtest `
              zlib `
              expat
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { break }
            if ($i -eq $attempts) { throw "vcpkg install failed after $attempts attempts" }
            Write-Host "vcpkg install failed (exit $code); retrying in 30s..."
            Start-Sleep -Seconds 30
          }

      - name: Save vcpkg downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ github.run_id }}-${{ github.run_attempt }}

      # --- Configure / Build / Test ------------------------------------------
      - name: Configure
        shell: pwsh
        run: |
          # vcpkg's hdf5 has no module-mode wrapper, so point the stock
          # FindHDF5 module at the vcpkg prefix (also used by HighFive). Use
          # forward slashes — a backslash path (C:\vcpkg) trips CMake 4.x's
          # "invalid character escape" when FindHDF5 re-emits it.
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT".Replace('\', '/')
          $hdf5Root = "$vcpkgRoot/installed/$env:VCPKG_TRIPLET"
          $qtRoot = "$env:QT_ROOT_DIR".Replace('\', '/')
          # Search both the vcpkg install prefix (spdlog / nlohmann_json / gtest
          # config packages) and Qt explicitly, so config-mode discovery does
          # not depend on the toolchain's implicit prefix.
          $prefix = "$hdf5Root;$qtRoot"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DHDF5_ROOT="$hdf5Root" `
            -DCMAKE_PREFIX_PATH="$prefix" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        shell: pwsh
        env:
          # No display on the runner; render Qt widgets off-screen.
          QT_QPA_PLATFORM: offscreen
        # (An earlier exclusion of the widget fixtures here masked what
        # turned out to be a real use-after-free in the empty-hint overlay
        # during view teardown — fixed in StyleKit; full coverage restored.)
        run: ctest --test-dir build -C $env:BUILD_TYPE --output-on-failure

      # --- Package ------------------------------------------------------------
      # Reduce build/bin to what a user actually downloads, before packaging.
      #
      # Three things come out. The linker's leftovers: .ilk is incremental-link
      # scratch, meaningless outside the build tree that produced it, and .pdb
      # are debug symbols only useful alongside a matching local build — on
      # v0.5.0 those were 297 MB and 361 MB of a 764 MB artifact, 86% of it.
      # Every executable except the application itself: the test runner has
      # already done its job in the Test step, the standalone tools are the
      # same widgets the app hosts as tabs, and ads_dt_probe is a PLC
      # diagnostic rather than something to hand a user. And then the DLLs
      # those executables brought in: vcpkg's applocal deployment runs per
      # target, so dropping the test runner left gtest.dll and gtest_main.dll
      # behind — they shipped in v0.5.1, imported by nothing.
      #
      # This runs BEFORE windeployqt, which matters. Every DLL in build/bin at
      # this point came from the build, so "does the application import it?" is
      # a fair question to ask of all of them. It is NOT a fair question after
      # windeployqt: Qt deploys blobs that nothing imports and loads by name at
      # runtime — opengl32sw.dll for software OpenGL, the d3d compilers — and
      # the same rule would quietly delete them.
      #
      # Everything is still built and tested here; this only decides what gets
      # published. Add a name to $ship below to include another executable.
      #
      # If a released build ever needs symbolising, re-run this workflow and
      # take the .pdb from build/bin before this step, or publish them as their
      # own artifact; don't put them back in the user-facing one.
      - name: Trim to the shipped application
        shell: pwsh
        run: |
          $before = (Get-ChildItem build\bin -Recurse -File |
                     Measure-Object Length -Sum).Sum
          Get-ChildItem build\bin -Recurse -Include *.ilk,*.pdb |
            Remove-Item -Force
          $ship = @("ScopeAnalyser.exe")
          Get-ChildItem build\bin -File -Filter *.exe |
            Where-Object { $ship -notcontains $_.Name } |
            Remove-Item -Force

          # Walk what the shipped executable imports, transitively, and keep
          # only those. dumpbin comes from the MSVC environment set up above;
          # without it, keep everything rather than guess.
          if (-not (Get-Command dumpbin -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::dumpbin not on PATH; keeping every built DLL"
          } else {
            $present = @{}
            Get-ChildItem build\bin -File -Filter *.dll |
              ForEach-Object { $present[$_.Name.ToLower()] = $_.FullName }
            $needed = [System.Collections.Generic.HashSet[string]]::new()
            $queue  = [System.Collections.Generic.Queue[string]]::new()
            Get-ChildItem build\bin -File -Filter *.exe |
              ForEach-Object { $queue.Enqueue($_.FullName) }
            while ($queue.Count -gt 0) {
              $imports = & dumpbin /nologo /dependents $queue.Dequeue() |
                         Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
                         ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
              foreach ($dep in $imports) {
                if ($present.ContainsKey($dep) -and $needed.Add($dep)) {
                  $queue.Enqueue($present[$dep])
                }
              }
            }
            Get-ChildItem build\bin -File -Filter *.dll |
              Where-Object { -not $needed.Contains($_.Name.ToLower()) } |
              ForEach-Object {
                Write-Host "dropping $($_.Name): nothing shipped imports it"
                Remove-Item $_.FullName -Force
              }
          }
          $after = (Get-ChildItem build\bin -Recurse -File |
                    Measure-Object Length -Sum).Sum
          Write-Host ("payload {0:N0} MB -> {1:N0} MB" -f ($before/1MB), ($after/1MB))

      # windeployqt copies the Qt runtime DLLs/plugins next to the executable;
      # the vcpkg toolchain already deployed the non-Qt DLLs (applocal). The
      # result under build/bin is a self-contained, runnable set of binaries.
      # Only the shipped application is left by now, so this deploys once.
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          Get-ChildItem build\bin\*.exe |
            ForEach-Object {
              Write-Host "Deploying $($_.Name)"
              & $windeployqt --release --no-translations --no-compiler-runtime $_.FullName
            }

      # Prove the bundle still runs after all that. The app's screenshot mode
      # seeds demo data, walks every tab, exports the interactive HTML and
      # quits by itself, so a DLL or Qt plugin that should not have been
      # removed shows up here as a failure to start rather than as a broken
      # download.
      #
      # Run against a COPY with the offscreen platform plugin added: the runner
      # has no desktop session to open a real window on, and adding the plugin
      # to the copy keeps the thing being tested identical to the thing being
      # shipped in every other respect. PATH is cut back to the system
      # directories on purpose — Qt's own bin is on PATH in this job, and
      # leaving it there would let the app resolve a Qt DLL that is missing
      # from the bundle.
      - name: Smoke-test the packaged application
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          Remove-Item -Recurse -Force $smoke, $shots -ErrorAction SilentlyContinue
          Copy-Item build\bin $smoke -Recurse
          New-Item -ItemType Directory -Force -Path $shots, "$smoke\platforms" | Out-Null
          Copy-Item (Join-Path $env:QT_ROOT_DIR "plugins\platforms\qoffscreen.dll") `
                    "$smoke\platforms\"

          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SCOPE_SHELL_SCREENSHOT_DIR = $shots
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $app = Start-Process -FilePath "$smoke\ScopeAnalyser.exe" -PassThru -NoNewWindow
          $null = $app.Handle          # cache it, or ExitCode reads back empty
          if (-not $app.WaitForExit(180000)) {
            $app.Kill()
            throw "ScopeAnalyser.exe did not finish its screenshot run within 180 s"
          }
          if ($app.ExitCode -ne 0) {
            throw ("ScopeAnalyser.exe exited with 0x{0:X8} — a missing DLL or Qt plugin?" -f $app.ExitCode)
          }
          $produced = @(Get-ChildItem $shots -File)
          if ($produced.Count -eq 0) { throw "the app started but produced nothing" }
          Write-Host ("smoke run wrote {0} files: {1}" -f $produced.Count,
                      ($produced.Name -join ", "))

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ScopeAnalyser-windows-x64
          path: build/bin/
          if-no-files-found: error
